version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jansetu-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CLIENT_ORIGIN=http://localhost
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - jansetu-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jansetu-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - jansetu-network

  redis:
    image: redis:7-alpine
    container_name: jansetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jansetu-network

networks:
  jansetu-network:
    driver: bridge

volumes:
  redis-data:
