name: JanSetu Industrial CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-audit:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server test suite (Vitest)
        run: npm --prefix server test
        env:
          NODE_ENV: test
          GEMINI_API_KEY: mock-ci-key
          CLIENT_ORIGIN: http://localhost:5173

      - name: Run client test suite (Vitest)
        run: npm --prefix client test

      - name: Run dependency security audit
        run: npm audit --audit-level=high || true

      - name: Build client production bundle
        run: npm --prefix client run build

  docker-build:
    name: Docker Container Validation
    needs: test-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: jansetu-server:ci-test

      - name: Build Client Container
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: jansetu-client:ci-test
